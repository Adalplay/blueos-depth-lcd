name: Publicar extensão BlueOS

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Habilitar compilação ARM
        uses: docker/setup-qemu-action@v3

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: |
            adalcirjr/blueos-depth-lcd:0.2.2
            adalcirjr/blueos-depth-lcd:latest
